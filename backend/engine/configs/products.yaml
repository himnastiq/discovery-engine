type: products
display_name: Products
card_type: product
dataset:
  adapter: amazon_products
  variant: "video_games"
  display_name: "Amazon Video Games"
  min_user_interactions: 5
  min_item_interactions: 5
signal:
  positive_threshold: 4.0
  use_rating_as_weight: true
split:
  strategy: chronological
  ratio: 0.8
  seed: 42
model:
  name: sar
  params:
    similarity_type: jaccard
    time_decay_coefficient: 30
    timedecay_formula: true
  allow_repeat: false
  supports_cold_start: true
evaluation:
  k: [5, 10, 20]
  cold_start_history_sizes: [0, 1, 2, 3, 5, 10, 20]
  baselines: [popularity, random]
  protocol: standard
  max_test_users: 2000
  post_train: [product_checks]
serving:
  top_neighbors_per_item: 50
  max_items_in_similarity: 8000
chat:
  noun: product
  card_fields: [title, subtitle, categories]
  starter_prompts:
    - "Find popular video games matching my taste"
    - "Recommend top-rated retro gaming gear"
    - "What games are similar to Super Mario?"
  persona_wording: "shopping history and category affinities"
fast:
  dataset:
    variant: "instruments"
    display_name: "Amazon Instruments"
    min_user_interactions: 3
    min_item_interactions: 3
  serving:
    max_items_in_similarity: 2000
  evaluation:
    cold_start_history_sizes: [0, 1, 3, 5]
    max_test_users: 50
