type: articles
display_name: Articles
card_type: article
dataset:
  adapter: mind_articles
  variant: "small"
  display_name: "MIND"
  min_user_interactions: 3
signal:
  positive_threshold: 1.0
  use_rating_as_weight: false
split:
  strategy: impression_time
  ratio: 0.8
  seed: 42
model:
  name: tfidf_profile
  params:
    max_features: 10000
    min_df: 2
    max_df: 0.95
    recency_weight: true
  allow_repeat: false
  supports_cold_start: true
evaluation:
  k: [5, 10, 20]
  cold_start_history_sizes: [0, 1, 2, 3, 5, 10, 20]
  baselines: [popularity, random]
  recency_window: 86400
  protocol: dual_protocol
  max_test_users: 200
serving:
  top_neighbors_per_item: 50
  max_items_in_similarity: 8000
  recency_window: 86400
chat:
  noun: article
  card_fields: [title, subtitle, categories]
  starter_prompts:
    - "Summarize top news matching my interests"
    - "What are the latest tech breakthroughs?"
    - "Find sports stories from today"
  persona_wording: "reading history and topic interests"
fast:
  dataset:
    variant: "small"
    display_name: "MIND"
  model:
    params:
      max_features: 2000
  evaluation:
    cold_start_history_sizes: [0, 1, 3, 5]
    recency_window: 86400
    max_test_users: 50
  serving:
    recency_window: 86400
